<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>デンタルトーク</title>
<style>
  :root{--main:#0f8fa8;--sub:#f4fbfd;--text:#14212b;--danger:#e85a5a;--gray:#f7f9fa;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:#f7fbfc;color:var(--text);}
  header{position:sticky;top:0;z-index:10;background:#fff;padding:12px 14px 10px;border-bottom:1px solid #e6eef1;box-shadow:none}
  h1{margin:0;font-size:22px;letter-spacing:.04em;display:flex;align-items:center;gap:8px;color:#0f6f82}
  .screen{margin-top:10px;background:#fff;border:2px solid #d9eef3;border-radius:16px;min-height:300px;padding:24px 20px;font-size:40px;line-height:1.38;font-weight:800;word-break:break-word;white-space:pre-wrap;box-shadow:none;}
  .placeholder{color:#91a3aa;font-weight:600}
  .actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
  button{font-family:inherit;border:1px solid #dbe8ec;border-radius:12px;padding:12px 10px;font-size:18px;font-weight:800;background:#fff;box-shadow:none;color:var(--text)}
  button:active{transform:scale(.98);opacity:.85}
  .primary{background:var(--main);color:#fff;border-color:var(--main)}.danger{background:#fff;color:#d94545;border:2px solid #f0b0b0}.light{background:#fff;color:#0f6f82;border:1px solid #dbe8ec}
  main{padding:10px 12px 88px}.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;position:sticky;top:430px;background:#f7fbfc;z-index:8}.tab{white-space:nowrap;padding:9px 13px;border-radius:999px;background:#fff;font-size:16px;box-shadow:none;border:1px solid #dbe8ec}.tab.active{background:var(--main);color:white;border-color:var(--main)}
  .section-title{font-size:18px;font-weight:800;margin:10px 4px;color:#31515b;display:flex;justify-content:space-between;align-items:center}.hint{font-size:13px;color:#6e858d;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.word{min-height:52px;font-size:18px;line-height:1.25;background:#fff;border:1px solid #dbe8ec;text-align:center}.phrase{grid-column:span 2;text-align:left;background:#fff;border-color:#dbe8ec}.fav{border:2px solid #94d6e2;background:#fff}
  .add-panel{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e6eef1;padding:8px 12px;box-shadow:none;z-index:20}.add-row{display:grid;grid-template-columns:1fr 110px;gap:8px}input,select{font-family:inherit;font-size:17px;border:1px solid #cfe0e5;border-radius:10px;padding:10px;background:#fff}.small-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.reset{font-size:14px;padding:9px;background:#fff;color:#59676b;border:1px solid #dbe8ec}
  @media (min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.phrase{grid-column:span 3}.screen{font-size:48px;min-height:330px}.tabs{top:465px}}
</style>
</head>
<body>
<header>
  <h1>🦷 デンタルトーク</h1>
  <div id="screen" class="screen"><span class="placeholder">ここに文章ができます</span></div>
  <div class="actions">
    <button class="light" onclick="addSpace()">空白</button>
    <button class="light" onclick="undoText()">一つ戻す</button>
    <button class="danger" onclick="clearText()">全部消す</button>
  </div>
</header>
<main>
  <div class="tabs" id="tabs"></div>
  <div class="section-title"><span id="categoryTitle"></span><span class="hint">よく使う順に自動で上へ</span></div>
  <div class="grid" id="wordGrid"></div>
</main>
<div class="add-panel">
  <div class="add-row">
    <input id="newWord" placeholder="単語・文章を追加" />
    <button class="primary" onclick="addWord()">追加</button>
  </div>
  <div class="small-row">
    <select id="newCategory"></select>
    <button class="reset" onclick="resetCounts()">使用回数リセット</button>
  </div>
</div>
<script>
const defaultData = {
  "よく使う": ["痛かったら手を上げてください", "うがいしてください", "口を開けてください", "もう少し開けてください", "大丈夫ですか？", "少し音がします", "水が出ます", "終わりました"],
  "あいさつ": ["こんにちは", "お名前を教えてください", "今日はどうされましたか？", "よろしくお願いします", "お疲れさまでした"],
  "症状": ["痛い", "少し痛い", "しみる", "腫れている", "出血がある", "違和感がある", "いつからですか？"],
  "部位": ["上", "下", "右", "左", "前歯", "奥歯", "ここ", "この歯", "右上", "右下", "左上", "左下"],
  "確認": ["痛いですか？", "しみますか？", "どのくらい痛いですか？", "気分は悪くないですか？", "苦しくないですか？"],
  "指示": ["閉じてください", "楽にしてください", "鼻で呼吸してください", "力を抜いてください", "そのままでお願いします", "少し待ってください"],
  "処置": ["レントゲンを撮ります", "麻酔をします", "少しチクッとします", "削ります", "クリーニングします", "お薬を塗ります", "型取りをします"],
  "終了": ["今日はここまでです", "次回の予約を取ります", "受付でお待ちください", "お大事にしてください"]
};
let data = JSON.parse(localStorage.getItem('dt_words_v2') || 'null') || defaultData;
let counts = JSON.parse(localStorage.getItem('dt_counts_v1') || '{}');
let textParts = [];
let currentCategory = Object.keys(data)[0];
const screen = document.getElementById('screen');
function save(){ localStorage.setItem('dt_words_v2', JSON.stringify(data)); localStorage.setItem('dt_counts_v1', JSON.stringify(counts)); }
function keyFor(cat, word){ return cat + '::' + word; }
function renderTabs(){
  const tabs = document.getElementById('tabs'); tabs.innerHTML='';
  Object.keys(data).forEach(cat=>{ const b=document.createElement('button'); b.className='tab'+(cat===currentCategory?' active':''); b.textContent=cat; b.onclick=()=>{currentCategory=cat; render();}; tabs.appendChild(b); });
  const sel=document.getElementById('newCategory'); sel.innerHTML=''; Object.keys(data).forEach(cat=>{const o=document.createElement('option'); o.value=cat; o.textContent=cat; sel.appendChild(o);});
}
function sortedWords(cat){ return [...data[cat]].sort((a,b)=> (counts[keyFor(cat,b)]||0) - (counts[keyFor(cat,a)]||0)); }
function renderWords(){
  document.getElementById('categoryTitle').textContent = currentCategory;
  const grid=document.getElementById('wordGrid'); grid.innerHTML='';
  sortedWords(currentCategory).forEach(word=>{ const b=document.createElement('button'); const c=counts[keyFor(currentCategory,word)]||0; b.className='word'+(c>=3?' fav':'')+(word.length>9?' phrase':''); b.textContent=word; b.onclick=()=>appendWord(word); grid.appendChild(b); });
}
function renderScreen(){ screen.textContent = textParts.length ? textParts.join('') : ''; if(!textParts.length){ screen.innerHTML = '<span class="placeholder">ここに文章ができます</span>'; } }
function render(){ renderTabs(); renderWords(); renderScreen(); }

function currentText(){ return textParts.join(''); }
function isSentence(word){ return word.length >= 7 || /[。？！?!]$/.test(word) || /(ください|お願いします|します|ですか|です|ました|ます)$/.test(word); }
function appendWord(word){
  if(textParts.length && isSentence(word) && !currentText().endsWith('\n')) textParts.push('\n');
  textParts.push(word);
  const k=keyFor(currentCategory,word); counts[k]=(counts[k]||0)+1;
  save(); render();
}
function addSpace(){ textParts.push('　'); renderScreen(); }

function clearText(){ textParts=[]; renderScreen(); }
function undoText(){ textParts.pop(); renderScreen(); }
function addWord(){ const input=document.getElementById('newWord'); const word=input.value.trim(); const cat=document.getElementById('newCategory').value; if(!word) return; if(!data[cat].includes(word)) data[cat].push(word); input.value=''; save(); currentCategory=cat; render(); }
function resetCounts(){ if(confirm('使用回数をリセットしますか？')){ counts={}; save(); render(); } }
async function copyText(){ const t=textParts.join(''); if(!t) return; try{ await navigator.clipboard.writeText(t); alert('コピーしました'); }catch(e){ alert('コピーできませんでした'); } }
render();
</script>
</body>
</html>
